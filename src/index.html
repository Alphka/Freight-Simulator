<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8">
		<title>Simulação de Frete &raquo; Alphka</title>
		<meta name="author" content="Alphka">
		<meta name="keywords" content="frete, entrega, Alphka, simulação, senai, qualidade">
		<meta name="description" content="Um simulador de fretes da empresa Alphka, criada como requisito da disciplina Gestão de Documentos da Qualidade">
		<meta property="og:title" content="Simulação de Fretes - Alphka">
		<meta property="og:description" content="Simulador de fretes da empresa Alphka">
		<meta property="og:image" content="/images/truck_logo_squared.png">
		<meta property="og:image:alt" content="Uma imagem com um caminhão representando a logo da empresa">
		<meta property="og:type" content="website">
		<meta property="og:locale" content="pt_BR">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="theme-color" content="#5271FF">
		<meta name="color-scheme" content="light">
		<link rel="stylesheet" href="/styles/main.scss">
		<link rel="stylesheet" href="/styles/index.scss">
		<link rel="shortcut icon" href="/images/favicon.ico">
		<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
		<link rel="manifest" href="/site.webmanifest">
		<script type="module" src="/scripts/index.ts"></script>
	</head>
	<body class="bg-body-tertiary">
		<main class="container py-4 py-md-5">
			<div class="row justify-content-center">
				<div class="col-12 col-lg-10 col-xl-8">
					<section class="card shadow-sm">
						<div class="card-body p-4 p-md-5">
							<header class="d-flex align-items-center justify-content-center gap-3 mb-4">
								<img src="/images/truck_logo_squared.png" alt="" width="56" height="56">
								<h1 class="h3 m-0">Simulação de Frete</h1>
							</header>

							<form method="get" action="fullfilled.html" class="d-grid gap-4">
								<input type="hidden" name="country" value="Brasil">
								<input type="hidden" name="state" value="Minas Gerais">

								<fieldset>
									<legend class="fs-5">Dados do cliente</legend>
									<div class="row g-3">
										<div class="col-md-6">
											<label class="form-label" for="name">Nome completo</label>
											<input class="form-control" type="text" id="name" autocomplete="name" required>
										</div>
										<div class="col-md-6">
											<label class="form-label" for="email">Email para contato</label>
											<input class="form-control" type="email" id="email" autocomplete="email" required>
										</div>
									</div>
								</fieldset>

								<fieldset>
									<legend class="fs-5">Destino da entrega</legend>
									<div class="row g-3">
										<div class="col-md-8">
											<label class="form-label" for="city">Cidade</label>
											<select class="form-select" id="city" autocomplete="address-level2" name="city" required></select>
										</div>
										<div class="col-md-4">
											<label class="form-label" for="cep">CEP</label>
											<input class="form-control" type="text" id="cep" inputmode="numeric" pattern="\d{5}-\d{3}" autocomplete="postal-code" name="zip" required>
										</div>
										<div class="col-md-6">
											<label class="form-label" for="district">Bairro</label>
											<input class="form-control" type="text" id="district" name="district" autocomplete="address-level3" required>
										</div>
										<div class="col-md-6">
											<label class="form-label" for="street">Rua</label>
											<input class="form-control" type="text" id="street" autocomplete="address-line1" name="street" required>
										</div>
										<div class="col-5 col-md-4">
											<label class="form-label" for="houseNumber">Número</label>
											<input class="form-control" type="text" id="houseNumber" inputmode="numeric" autocomplete="address-line2" name="houseNumber" required>
										</div>
										<div class="col-7 col-md-8">
											<label class="form-label" for="complement">Complemento</label>
											<input class="form-control" type="text" autocomplete="address-line3" id="complement" name="complement">
										</div>
									</div>
								</fieldset>

								<fieldset>
									<legend class="fs-5">Dados dos produtos</legend>

									<div class="product row g-3 mb-3">
										<div class="col-md-6">
											<label class="form-label" for="product">Produto</label>
											<select class="form-select" id="product" name="product" required></select>
										</div>
										<div class="col-7 col-md-3">
											<label class="form-label" for="productSize">Tamanho</label>
											<input type="text" class="form-control" id="productSize" name="productSize" autocomplete="off" required>
											<datalist></datalist>
										</div>
										<div class="col-5 col-md-3">
											<label class="form-label" for="quantity">Quantidade</label>
											<input type="number" class="form-control" id="quantity" min="1" name="quantity" autocomplete="off" required>
										</div>
									</div>

									<button type="button" class="btn btn-outline-primary" id="addProduct">Adicionar produto</button>
								</fieldset>

								<div class="form-check">
									<input class="form-check-input" type="checkbox" id="terms" required>
									<label class="form-check-label" for="terms">Eu aceito os termos e condições.</label>
								</div>

								<div class="text-center">
									<button type="submit" class="btn btn-primary btn-lg px-5">Enviar</button>
								</div>
							</form>
						</div>
					</section>
				</div>
			</div>
		</main>
	</body>
</html>
