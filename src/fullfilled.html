<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8">
		<title>Simulação concluída &raquo; Alphka</title>
		<meta name="description" content="Simulação concluída!">
		<meta property="og:title" content="Simulação concluída - Alphka">
		<meta property="og:description" content="Simulação concluída!">
		<meta property="og:image" content="/images/truck_logo_squared.png">
		<meta property="og:image:alt" content="Uma imagem com um caminhão representando a logo da empresa">
		<meta property="og:type" content="website">
		<meta property="og:locale" content="pt_BR">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="theme-color" content="#5271FF">
		<meta name="color-scheme" content="light">
		<link rel="stylesheet" href="/styles/main.scss">
		<link rel="shortcut icon" href="/images/favicon.ico">
		<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
		<link rel="manifest" href="/site.webmanifest">
		<script type="module" src="/scripts/fullfilled.ts"></script>
	</head>
	<body class="bg-body-tertiary">
		<main class="container py-4 py-md-5">
			<div class="row justify-content-center">
				<div class="col-12 col-lg-10 col-xl-8">
					<section class="card shadow-sm">
						<div class="card-body p-4 p-md-5">
							<header class="text-center mb-4">
								<h1 class="h3">Simulação finalizada!</h1>
								<h2 class="h5 text-body-secondary m-0">Dados recebidos</h2>
							</header>

							<div class="table-responsive">
								<table class="table table-sm" id="address">
									<thead>
										<tr>
											<th scope="col" colspan="2">Endereço</th>
										</tr>
									</thead>
									<tbody>
										<tr>
											<th scope="row">País</th>
											<td id="country">Brasil</td>
										</tr>
										<tr>
											<th scope="row">Estado</th>
											<td id="state">Minas Gerais</td>
										</tr>
										<tr>
											<th scope="row">Cidade</th>
											<td id="city"></td>
										</tr>
										<tr>
											<th scope="row">CEP</th>
											<td id="zip"></td>
										</tr>
										<tr>
											<th scope="row">Bairro</th>
											<td id="district"></td>
										</tr>
										<tr>
											<th scope="row">Rua</th>
											<td id="street"></td>
										</tr>
										<tr>
											<th scope="row">Número</th>
											<td id="houseNumber"></td>
										</tr>
										<tr>
											<th scope="row">Complemento</th>
											<td id="complement"></td>
										</tr>
									</tbody>
								</table>
							</div>

							<hr>

							<div class="table-responsive">
								<table class="table table-sm" id="products">
									<thead>
										<tr>
											<th scope="col" colspan="5">Produtos</th>
										</tr>
									</thead>
									<tbody>
										<tr>
											<th scope="col"></th>
											<th scope="col">Nome</th>
											<th scope="col">Tamanho</th>
											<th scope="col">Quantidade</th>
											<th scope="col">Preço</th>
										</tr>
										<tr class="product">
											<th scope="row">1</th>
											<td></td>
											<td></td>
											<td></td>
											<td></td>
										</tr>
									</tbody>
								</table>
							</div>

							<hr>

							<div class="table-responsive col-md-8 mx-auto">
								<table class="table table-sm" id="prices">
									<thead>
										<tr>
											<th scope="col" colspan="3">Tabela de preços</th>
										</tr>
									</thead>
									<tbody></tbody>
								</table>
							</div>

							<div class="text-center mt-4">
								<a class="btn btn-outline-primary" href="/">Nova simulação</a>
							</div>
						</div>
					</section>
				</div>
			</div>
		</main>
	</body>
</html>
